name: Build APK

# Compila el APK de debug en los servidores de GitHub (con Android SDK ya
# instalado). No necesitas Android Studio ni SDK en tu PC.
#
# Se dispara:
#   - en cada push a main que toque el proyecto Gear360App
#   - manualmente desde la pestaña "Actions" (workflow_dispatch)
#
# El APK queda disponible como "artifact" descargable al final del build.

on:
  push:
    branches: [ main ]
    paths:
      - 'Gear360App/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Gear360App

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gear360-debug-apk
          path: Gear360App/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
