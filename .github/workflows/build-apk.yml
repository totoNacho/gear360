name: Build APK

# Compila el APK en los servidores de GitHub (con Android SDK ya instalado).
# No necesitas Android Studio ni SDK en tu PC.
#
# Produce DOS APKs como artifacts:
#   - app-debug.apk    : firmado en debug (siempre)
#   - app-release.apk  : firmado con TU keystore, SOLO si configuraste los
#                        secrets (ver abajo). Es el que evita el aviso de
#                        "app no reconocida" de forma mas limpia.
#
# Secrets necesarios para el release firmado (Settings > Secrets and
# variables > Actions > New repository secret):
#   KEYSTORE_BASE64     -> el archivo .jks codificado en base64
#   KEYSTORE_PASSWORD   -> contrasena del keystore
#   KEY_ALIAS           -> alias de la clave (gear360)
#   KEY_PASSWORD        -> contrasena de la clave
#
# Si NO configuras los secrets, el build igual genera el APK de debug.

on:
  push:
    branches: [ main ]
    paths:
      - 'Gear360App/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write   # necesario para publicar Releases con el APK

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Gear360App

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # El runner ubuntu-latest ya trae el Android SDK preinstalado y expone
      # ANDROID_HOME / ANDROID_SDK_ROOT, asi que no hace falta instalarlo.

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # Reconstruye el keystore desde el secret base64 (si existe).
      - name: Decode keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/Gear360App/gear360-release.jks"
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
            echo "Keystore reconstruido."
          else
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
            echo "Sin secret de keystore: se compilara solo debug."
          fi

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build signed release APK
        if: steps.keystore.outputs.has_keystore == 'true'
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/Gear360App/gear360-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: gear360-debug-apk
          path: Gear360App/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        if: steps.keystore.outputs.has_keystore == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: gear360-release-apk
          path: Gear360App/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # Publica el APK firmado como un Release de GitHub, con una pagina fija
      # de descargas y un historial de versiones. Solo si hay keystore (APK
      # firmado) y solo en push a main (no en cada ejecucion manual de prueba).
      - name: Publish GitHub Release
        if: steps.keystore.outputs.has_keystore == 'true' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Gear 360 Downloader v1.0.${{ github.run_number }}
          body: |
            APK firmado de Gear 360 Downloader.

            Descarga **app-release.apk** mas abajo e instalalo en el telefono
            (activa "instalar apps de origen desconocido" si te lo pide).

            Build automatico #${{ github.run_number }}.
          files: Gear360App/app/build/outputs/apk/release/*.apk
          fail_on_unmatched_files: true
